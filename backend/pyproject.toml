[project]
name = "twinauta-backend"
version = "0.1.0"
description = "Initial TwinNauta API with explicit illustrative data."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "uvicorn>=0.34,<1",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["ruff>=0.17,<0.18", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
