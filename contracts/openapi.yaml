  /api/v1/assessments/{assessment_id}/graphs/{view}:
    get:
      summary: Get Graph
      description: Retrieve one of the three saved graph projections.
      operationId: get_graph
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      - name: view
        in: path
        required: true
        schema:
          enum:
          - evidence
          - scenario
          - actions
