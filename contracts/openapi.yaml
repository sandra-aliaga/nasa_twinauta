        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
