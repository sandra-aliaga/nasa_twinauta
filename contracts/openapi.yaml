      tags:
      - health
      summary: Liveness
      description: Confirm that the HTTP process is responding.
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Liveness Health Live Get
  /health/ready:
    get:
      tags:
      - health
      summary: Readiness
      description: Check database connectivity and the presence of migrated, seeded
        tables.
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    Action:
