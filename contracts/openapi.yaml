          description: Unprocessable Entity
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
  /api/v1/assessments/{assessment_id}/actions/{action_id}:
    patch:
      summary: Update Action Status
      description: Update tracking with optimistic revision checking and a database
        row lock.
      operationId: update_action_status
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
  /api/v1/telemetry/{recording_id}/metadata:
    get:
      summary: Get Recording Metadata
      description: Describe a registered recording and its independent clock.
      operationId: get_recording_metadata
      parameters:
      - name: recording_id
        in: path
        required: true
        schema:
          type: string
          title: Recording Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryRecording'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
  /api/v1/telemetry/{recording_id}:
    get:
      summary: Get Telemetry Window
      description: Read a bounded segment without filling missing values.
      operationId: get_telemetry_window
      parameters:
      - name: recording_id
        in: path
        required: true
        schema:
          type: string
          title: Recording Id
      - name: start_s
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          title: Start S
      - name: end_s
        in: query
        required: true
        schema:
          type: number
          exclusiveMinimum: 0
          title: End S
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryWindow'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
