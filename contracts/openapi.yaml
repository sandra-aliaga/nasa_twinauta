      summary: Get Knowledge Base Metadata
      description: Describe the local literature bundle and its review status.
      operationId: get_knowledge_base_metadata
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseMetadata'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/papers:
    get:
      summary: Search Papers
      description: Search the local bibliographic candidate corpus.
      operationId: search_papers
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Q
      - name: region_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Region Id
      - name: view
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - evidence
            - scenario
            - actions
            type: string
          - type: 'null'
          title: View
      - name: review_status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - pending
            - reviewed
            type: string
          - type: 'null'
          title: Review Status
      - name: year_from
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1800
          - type: 'null'
          title: Year From
      - name: year_to
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1800
          - type: 'null'
          title: Year To
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: indicator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Indicator Id
      - name: module_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Module Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperPage'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
  /api/v1/papers/{paper_id}:
    get:
      summary: Get Paper
      description: Return a bibliographic candidate with explicit analysis boundaries.
      operationId: get_paper
      parameters:
      - name: paper_id
        in: path
        required: true
        schema:
          type: string
          title: Paper Id
      - name: assessment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Assessment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
  /api/v1/knowledge-graph:
    get:
      summary: Get Knowledge Graph
      description: Explore editorial paper-topic relations without scientific inference.
      operationId: get_knowledge_graph
      parameters:
      - name: view
        in: query
        required: true
        schema:
          enum:
          - evidence
          - scenario
          - actions
          type: string
          title: View
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Q
      - name: region_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Region Id
      - name: review_status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - pending
            - reviewed
            type: string
          - type: 'null'
          title: Review Status
      - name: year_from
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1800
          - type: 'null'
          title: Year From
      - name: year_to
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1800
          - type: 'null'
          title: Year To
      - name: paper_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Paper Id
      - name: assessment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Assessment Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: indicator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Indicator Id
      - name: module_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Module Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphPage'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unprocessable Entity
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal Server Error
  /api/v1/cases/{case_id}/regions:
    get:
      summary: List Regions
      description: Return semantic regions without assuming GLB mesh names.
      operationId: list_regions
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
